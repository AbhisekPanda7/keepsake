# Render reads this when the repository is connected as a Blueprint.
# "sync: false" means Render asks for the value and it's never kept in Git.
services:
  - type: web
    name: keepsake-backend
    runtime: docker
    plan: free
    # Beside the Supabase database (ap-southeast-1), so each query doesn't cross an ocean.
    # A region can't be changed after the service is created.
    region: singapore
    rootDir: backend
    healthCheckPath: /actuator/health
    envVars:
      - key: DATABASE_URL
        sync: false
      - key: DATABASE_USERNAME
        sync: false
      - key: DATABASE_PASSWORD
        sync: false
      - key: JWT_SECRET
        generateValue: true
      - key: CORS_ALLOWED_ORIGINS
        sync: false
      - key: STORAGE_TYPE
        value: supabase
      - key: SUPABASE_URL
        sync: false
      - key: SUPABASE_SERVICE_KEY
        sync: false
      - key: SUPABASE_BUCKET
        value: photos
      # Password reset emails, sent through Brevo's API (Render's free plan blocks SMTP).
      # Set by hand to "brevo" together with the two below; with "brevo" and no key the app won't start.
      - key: MAIL_TYPE
        sync: false
      - key: MAIL_FROM
        sync: false
      - key: BREVO_API_KEY
        sync: false
      - key: APP_URL
        sync: false
